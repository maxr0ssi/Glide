name: Publish Web UI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-ui/**'

jobs:
  publish:
    name: Build & Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        registry-url: 'https://npm.pkg.github.com'
        cache: 'npm'
        cache-dependency-path: apps/web-ui/package-lock.json

    - name: Install dependencies
      run: cd apps/web-ui && npm ci

    - name: Run tests
      run: cd apps/web-ui && npx vitest run

    - name: Build library
      run: cd apps/web-ui && npm run build:lib

    - name: Publish
      run: cd apps/web-ui && npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
